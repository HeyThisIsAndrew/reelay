name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-mac:
    name: Build macOS app
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./packaging/build_mac.sh
      - name: Self-test the packaged app (bundled ffmpeg)
        run: REELAY_BUNDLED_FFMPEG=1 dist/Reelay.app/Contents/MacOS/Reelay --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Reelay-macOS
          path: dist/*.dmg

  build-windows:
    name: Build Windows app
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: .\packaging\build_windows.ps1
        shell: pwsh
      - name: Self-test the packaged app (bundled ffmpeg)
        shell: pwsh
        run: |
          $env:REELAY_BUNDLED_FFMPEG = "1"
          $p = Start-Process "dist\Reelay\Reelay.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: Reelay-Windows
          path: dist/*.zip

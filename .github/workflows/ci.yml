# Everyday checks: Linux only (1x minutes). macOS and Windows (10x and 2x minutes) run only in
# release.yml, when a release is published or someone starts it by hand.
name: CI

# PAUSED (October 2026): the GitHub Actions minutes for this month are used up, so tests and builds run
# locally on the Mac (`python -m pytest -q`, `./packaging/build_mac.sh`). The workflow is also disabled on
# GitHub (`gh workflow disable CI`). To bring it back: restore the push / pull_request triggers below, then
# `gh workflow enable CI`.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore: ["docs/**", "**/*.md", "LICENSE*"]
  # pull_request:
  #   paths-ignore: ["docs/**", "**/*.md", "LICENSE*"]

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Qt system libraries
        timeout-minutes: 6
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          REELAY_REDUCE_MOTION: "1"

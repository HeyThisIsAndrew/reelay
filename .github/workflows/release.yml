# macOS and Windows builds (and, optionally, their tests). These runners cost 10x (macOS) and 2x (Windows)
# minutes, so this never runs on a push: only when a GitHub release is published, or when you start it from
# Actions → Release builds → Run workflow and pick what you need.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which apps to build"
        type: choice
        options: [both, macos, windows]
        default: both
      test_on_each_os:
        description: "Also run the full tests on macOS and Windows (uses more minutes)"
        type: boolean
        default: false

# Starting another build for the same ref cancels the one still running.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Qt system libraries
        timeout-minutes: 6
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          REELAY_REDUCE_MOTION: "1"

  test-other-os:
    name: Tests (${{ matrix.os }})
    needs: test-linux
    if: github.event_name == 'workflow_dispatch' && inputs.test_on_each_os
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          REELAY_REDUCE_MOTION: "1"

  build-mac:
    name: Build macOS app
    needs: test-linux
    if: github.event_name == 'release' || inputs.platforms == 'both' || inputs.platforms == 'macos'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: ./packaging/build_mac.sh
      - name: Self-test the packaged app (bundled ffmpeg)
        run: REELAY_BUNDLED_FFMPEG=1 dist/Reelay.app/Contents/MacOS/Reelay --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Reelay-macOS
          path: dist/*.dmg
          retention-days: 14

  build-windows:
    name: Build Windows app
    needs: test-linux
    if: github.event_name == 'release' || inputs.platforms == 'both' || inputs.platforms == 'windows'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: .\packaging\build_windows.ps1
        shell: pwsh
      - name: Self-test the packaged app (bundled ffmpeg)
        shell: pwsh
        run: |
          $env:REELAY_BUNDLED_FFMPEG = "1"
          $p = Start-Process "dist\Reelay\Reelay.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: Reelay-Windows
          path: dist/*.zip
          retention-days: 14

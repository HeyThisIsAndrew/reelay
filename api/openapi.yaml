# Reelay Agent API contract. GENERATED from the code: do not edit by hand.
# Regenerate with:  python -m reelay.api --write-contract
# tests/test_api_contract.py fails if the live /openapi.json drifts from this file.
openapi: 3.1.0
info:
  title: Reelay Agent API
  description: 'Read a creator''s video board (each video is a content ticket with a readiness checklist), apply
    approved edits, record manual posts, and schedule posts to YouTube, Bluesky, Threads and Facebook. All /v1 routes
    need `Authorization: Bearer <token>`. Changes show up immediately on the Reelay desktop board.'
  version: 0.7.1
paths:
  /v1/board:
    get:
      tags:
      - videos
      summary: List a profile's videos on the board
      description: 'Videos in board order (Backlog → Staging → Scheduled → Published), with their post metadata,
        target

        platforms, per-platform status, and the original caption and stats. Videos fetched but not yet

        downloaded aren''t on the board, and archived videos only appear with archived=true.'
      operationId: getBoard
      security:
      - HTTPBearer: []
      parameters:
      - name: profile
        in: query
        required: true
        schema:
          type: string
          description: Profile name exactly as shown in Reelay's sidebar.
          title: Profile
        description: Profile name exactly as shown in Reelay's sidebar.
      - name: stage
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - backlog
            - staging
            - scheduled
            - published
            type: string
          - type: 'null'
          description: Only this board column.
          title: Stage
        description: Only this board column.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size (1-200).
          default: 50
          title: Limit
        description: Page size (1-200).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Videos to skip (from next_offset of the previous page).
          default: 0
          title: Offset
        description: Videos to skip (from next_offset of the previous page).
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          description: true lists archived videos instead.
          default: false
          title: Archived
        description: true lists archived videos instead.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardPage'
        '400':
          description: Bad request (e.g. missing or unknown profile).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid input; nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/videos/{video_id}:
    patch:
      tags:
      - videos
      summary: Update a video's post metadata
      description: 'Partial update of the ticket: its copy (title, description, tags, target_platforms, tiktok_text,

        instagram_text, bluesky_text, threads_text, facebook_text, hashtags) and its fields (transcript,

        thumbnail_path, content_type, topic, keywords, creator, original_publish_date, source_platform, source_url,

        authorization, derived_from). Everything is validated first; if anything is invalid nothing is written

        (422). Over-limit text is rejected, never shortened. Copy can''t change once the video is scheduled or

        published (409); ticket fields can. Each changed field is logged (GET /v1/videos/{video_id}/revisions).

        Returns the updated video.'
      operationId: updateVideo
      security:
      - HTTPBearer: []
      parameters:
      - name: video_id
        in: path
        required: true
        schema:
          type: integer
          title: Video Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No video with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflicts with the video's current state (already scheduled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid input; nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/videos/{video_id}/schedule:
    post:
      tags:
      - videos
      summary: Schedule or publish a video to its platforms
      description: 'Queues automatic posting through Reelay''s pipeline. YouTube uploads join the app''s upload
        queue (one at

        a time) and are scheduled on YouTube. Bluesky, Threads and Facebook post automatically only when enabled

        (see GET /v1/platforms auto_post); otherwise their copy is posted by hand. The Ready gate refuses any

        platform whose checklist isn''t passing (422 ticket_not_ready, see the video''s `readiness`) unless

        force=true. 409 if any requested platform is already scheduled or published.'
      operationId: scheduleVideo
      security:
      - HTTPBearer: []
      parameters:
      - name: video_id
        in: path
        required: true
        schema:
          type: integer
          title: Video Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          description: true schedules even if the ticket isn't ready (skips the Ready gate). Platform rules that
            would make the post fail still apply.
          default: false
          title: Force
        description: true schedules even if the ticket isn't ready (skips the Ready gate). Platform rules that would
          make the post fail still apply.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ScheduleRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No video with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflicts with the video's current state (already scheduled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'Nothing was scheduled. code=ticket_not_ready: the ticket isn''t ready for one or more of
            the platforms being scheduled (`problems` lists each one, prefixed with the platform, e.g. "Bluesky:
            Write the Bluesky post …"). Fix them with PATCH /v1/videos/{video_id}, or repeat the request with ?force=true
            to schedule anyway. Other codes (invalid_post, invalid_time, platform_disabled, invalid_platform) can''t
            be forced.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/videos/{video_id}/revisions:
    get:
      tags:
      - videos
      summary: A ticket's change history
      description: 'Every saved change to the ticket''s copy and fields: when, who (local app or api), which field,

          type: boolean
          title: Draft Saved
          description: False when title/description/tags are suggestions generated from the original caption and
            haven't been saved yet.
        custom_name:
          type: string
          title: Custom Name
          description: Reelay's custom file name for the video, if set.
        notes:
          type: string
          title: Notes
        file_path:
          anyOf:
          - type: string
          - type: 'null'
          title: File Path
          description: Local path of the downloaded video file.
        file_available:
          type: boolean
          title: File Available
          description: Whether the video file exists on disk.
        publications:
          items:
            $ref: '#/components/schemas/Publication'
          type: array
          title: Publications
          description: Per-platform publishing status (empty until scheduled).
        source:
          $ref: '#/components/schemas/SourceInfo'
        ready:
          type: boolean
          title: Ready
          description: 'READY: at least one of the video''s target platforms is ready (platforms with automatic
            posting off count as ready). Scheduling refuses platforms that aren''t (422 ticket_not_ready) unless
            forced.'
        readiness:
          additionalProperties:
            $ref: '#/components/schemas/PlatformReadinessOut'
          propertyNames:
            enum:
            - youtube
            - bluesky
            - threads
            - facebook
          type: object
          title: Readiness
          description: Checklist per target platform.
        ticket:
          $ref: '#/components/schemas/TicketFields'
        provenance:
          $ref: '#/components/schemas/Provenance'
        archived:
          type: boolean
          title: Archived
          description: Archived videos are hidden from the board (files and history kept).
          default: false
        publishing_history:
          additionalProperties:
            items:
              $ref: '#/components/schemas/HistoryItem'
            type: array
          propertyNames:
            enum:
            - youtube
            - tiktok
            - instagram
            - bluesky
            - threads
            - facebook
          type: object
          title: Publishing History
          description: 'What went where, when and how: automatic posts and manual ones, oldest first, per platform.
            Platforms with no history are omitted.'
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - id
      - profile
      - stage
      - title
      - description
      - tags
      - target_platforms
      - overrides
      - visibility
      - draft_saved
      - custom_name
      - notes
      - file_available
      - publications
      - source
      - ready
      - readiness
      - ticket
      - provenance
      - publishing_history
      title: Video
    VideoIds:
      properties:
        video_ids:
          items:
            type: integer
          type: array
          maxItems: 500
          minItems: 1
          title: Video Ids
      additionalProperties: false
      type: object
      required:
      - video_ids
      title: VideoIds
    VideoPatch:
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 1
          title: Title
          description: Title (1-100 characters, no < or >). Used on YouTube and Facebook.
        description:
          type: string
          title: Description
          description: Description (max 5,000 bytes, no < or >).
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags without '#', 500 characters in total.
        target_platforms:
          items:
            type: string
            enum:
            - youtube
            - bluesky
            - threads
            - facebook
          type: array
          minItems: 1
          title: Target Platforms
          description: Platforms to post to when scheduled.
        bluesky_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Bluesky Text
          description: Bluesky post text, max 300 characters (grapheme clusters, so an emoji counts once). null
            clears it.
        threads_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Threads Text
          description: Threads post text, max 500 characters (emoji count as their UTF-8 byte length). null clears
            it.
        tiktok_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Tiktok Text
          description: TikTok caption, max 4000 characters. null clears it.
        instagram_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Instagram Text
          description: Instagram caption, max 2200 characters and 30 hashtags. null clears it.
        facebook_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Facebook Text
          description: Facebook post text, max 63206 characters. null clears it.
        hashtags:
          anyOf:
          - type: string
          - type: 'null'
          title: Hashtags
          description: 'Shared hashtag block for the card, e.g. "#growth #healing". null clears it.'
        transcript:
          anyOf:
          - type: string
          - type: 'null'
          title: Transcript
          description: Full transcript. null clears it. Ticket fields like this can be edited at any stage.
        thumbnail_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Path
          description: Local path of the cover image.
        content_type:
          anyOf:
          - type: string
            enum:
            - short
            - long-form
            - clip
            - other
          - type: 'null'
          title: Content Type
        topic:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Topic
        keywords:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Keywords
        creator:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Creator
          description: Brand or person name.
        original_publish_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Original Publish Date
          description: ISO 8601 with a timezone.
        source_platform:
          anyOf:
          - type: string
            enum:
            - tiktok
            - instagram
            - youtube
          - type: 'null'
          title: Source Platform
        source_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Source Url
        authorization:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Authorization
          description: e.g. "Own content", "Managed account".
        derived_from:
          anyOf:
          - type: integer
          - type: 'null'
          title: Derived From
          description: Id of the video this one was cut from (same profile), or null.
      additionalProperties: false
      type: object
      title: VideoPatch
      description: Only these fields can be changed. Omitted fields are left as they are.
  securitySchemes:
    HTTPBearer:
      type: http
      description: 'Agent API token (system keychain: service "Reelay", account "agent_api_token"; or REELAY_API_TOKEN).'
      scheme: bearer

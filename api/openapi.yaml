          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    BoardPage:
      properties:
        profile:
          $ref: '#/components/schemas/ProfileRef'
        stage:
          anyOf:
          - type: string
            enum:
            - backlog
            - staging
            - scheduled
            - published
          - type: 'null'
          title: Stage
          description: The stage filter applied, if any.
        total:
          type: integer
          title: Total
          description: Videos matching the filter.
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
        next_offset:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Offset
          description: Pass as offset to get the next page; null on the last page.
        videos:
          items:
            $ref: '#/components/schemas/Video'
          type: array
          title: Videos
      type: object
      required:
      - profile
      - total
      - limit
